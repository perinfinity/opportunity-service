server.port=${PORT:8089}
spring.data.mongodb.uri=mongodb://localhost:27017/opportunities
spring.data.mongodb.embedded.version=8.0
spring.mongodb.embedded.version= 8.0
# Logging
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.mongodb.driver=ERROR

allowed.origin=http://localhost:4200

# Disable default command-line runners (optional if your app has runners)
spring.main.web-application-type=none
spring.main.lazy-initialization=true